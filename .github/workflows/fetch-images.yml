name: fetch-images
on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Post id (reads posts/<id>/images.json)'
        required: true
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin main && git reset --hard origin/main
      - run: python3 scripts/fetch_images.py "${{ github.event.inputs.post }}"
      - name: Commit
        run: |
          git config user.name "creativia-bot"
          git config user.email "creativia-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "Fetch images for ${{ github.event.inputs.post }}"
          git pull --rebase origin main
          git push
