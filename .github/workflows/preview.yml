name: preview
on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Post id'
        required: true
      frames:
        description: 'Comma separated seconds, e.g. 0,5,12'
        required: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin main && git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: (command -v ffmpeg && command -v jq) || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null); sudo apt-get install -y -qq fonts-noto-core >/dev/null || true
      - name: Voice (cached clips cost nothing)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          f=posts/${{ github.event.inputs.post }}/reel.json
          if [ "$(jq -r '.voice // false' $f)" = "true" ]; then node engine/voice.js ${{ github.event.inputs.post }}; fi
      - name: Stills
        if: github.event.inputs.frames != 'none'
        env:
          FRAMES: ${{ github.event.inputs.frames }}
        run: |
          eng=$(jq -r '.engine // 4' posts/${{ github.event.inputs.post }}/reel.json)
          node engine/reel$eng.js ${{ github.event.inputs.post }}
          mkdir -p posts/${{ github.event.inputs.post }}/preview
          rm -f posts/${{ github.event.inputs.post }}/preview/*
          cp engine/_tmp/v4-*.jpg posts/${{ github.event.inputs.post }}/preview/
      - name: Commit
        run: |
          git config user.name "creativia-bot"
          git config user.email "creativia-bot@users.noreply.github.com"
          rm -rf engine/_tmp
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "Preview stills for ${{ github.event.inputs.post }}"
          git pull --rebase origin main
          git push
