name: telegram-inbox
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-inbox
  cancel-in-progress: false
jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no bot token
        id: tok
        env: { T: "${{ secrets.TELEGRAM_BOT_TOKEN }}" }
        run: '[ -n "$T" ] && echo ok=1 >> $GITHUB_OUTPUT || echo "no token yet"'
      - name: Tools
        if: steps.tok.outputs.ok
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          pip install -q -U 'yt-dlp[default]'
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
      - name: Fetch new links and videos
        if: steps.tok.outputs.ok
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHATS: ${{ secrets.TELEGRAM_CHATS }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          export PATH=$HOME/.deno/bin:$PATH
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > /tmp/cookies.txt; fi
          python3 scripts/telegram_inbox.py
      - name: Commit
        if: steps.tok.outputs.ok
        run: |
          git config user.name "creativia-bot"
          git config user.email "creativia-bot@users.noreply.github.com"
          git add assets/inbox
          git diff --cached --quiet && exit 0
          git commit -m "Video inbox from Telegram"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
